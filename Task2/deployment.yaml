apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-service
  namespace: insuretech
  labels:
    app: test-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: test-service
    spec:
      containers:
        - name: test-service
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "10Mi"
            limits:
              cpu: "300m"
              memory: "15Mi"
      restartPolicy: Always